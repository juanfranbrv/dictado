[app]
name = "dictado"
version = "0.1.0"
debug = false
active_profile = "default"

[logging]
level = "INFO"
file = "logs/dictado.log"

[runtime]
ffmpeg_bin = "C:/ffmpeg/bin"

[hotkey]
combo = "ctrl+win"
mode = "hold"
force_language_es = "ctrl+win+s"
force_language_en = "ctrl+win+e"
apply_polish = "ctrl+win+enter"
discard_polish = "ctrl+win+backspace"

[audio]
sample_rate = 16000
channels = 1
device = ""
blocksize = 0

[stt]
provider = "faster-whisper"
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
local_files_only = true
warmup_on_startup = true

[injection]
method = "sendinput"
fallback_to_clipboard = true

[overlay]
enabled = true
style = "red-circle"
position = "bottom-center"
show_language = true

[debug_overlay]
enabled = false

[language]
preferred = ["es", "en"]
default = "es"
confidence_threshold = 0.75
switch_penalty = 0.15

[profiles.default]
stt_provider = "faster-whisper"
llm_provider = ""
llm_fallback_provider = ""
polish_enabled = true
style = "default"

[profiles.default.stt_config]
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
local_files_only = true
warmup_on_startup = true
beam_size = 5

[[profiles.default.llm_chain]]
provider = "google"
api_key = ""
model = "gemini-flash-lite-latest"
enabled = true
timeout = 10.0

[[profiles.default.llm_chain]]
provider = "google"
api_key = ""
model = "gemini-flash-latest"
enabled = true
timeout = 10.0

[[profiles.default.llm_chain]]
provider = "groq"
api_key = ""
model = "qwen/qwen3-32b"
enabled = true
timeout = 10.0

[[profiles.default.llm_chain]]
provider = "fireworks"
api_key = ""
model = "accounts/fireworks/models/minimax-m2p7"
enabled = true
timeout = 10.0

[profiles.fast]
stt_provider = "faster-whisper"
llm_provider = ""
polish_enabled = false
style = "default"

[profiles.fast.stt_config]
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
local_files_only = true
warmup_on_startup = true
beam_size = 1
